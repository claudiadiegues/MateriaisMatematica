<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemática A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f64'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Georgia,serif' font-style='italic'%3E%CF%80%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2523; --muted:#66706d; --line:#e4e1d9;
    --accent:#1f6f64; --accent-soft:#e3efec;
    --slides:#2f6fb3; --ficha:#c7671e; --resolucao:#2e8b57; --resumo:#8a4fb5; --app:#b8424f; --outro:#6b7280;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141917; --card:#1d2422; --ink:#e8ecea; --muted:#9aa5a1; --line:#2c3532;
           --accent:#5cc3b2; --accent-soft:#1f3531; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px}
  button{font:inherit;color:inherit}

  header{background:var(--accent);color:#fff;padding:34px 0 70px;position:relative;overflow:hidden}
  @media (prefers-color-scheme: dark){ header{background:#173f39} }
  header::after{content:"π  ∑  √  ∫  △  ∞  ≈  ∈";position:absolute;right:-10px;top:8px;
       font:italic 64px/1 Georgia,serif;letter-spacing:22px;opacity:.08;white-space:nowrap;pointer-events:none}
  h1{margin:0;font:600 clamp(26px,5vw,38px)/1.15 Georgia,"Times New Roman",serif}
  .sub{margin:8px 0 0;opacity:.85;font-size:15px}

  .panel{margin-top:-46px;position:relative;z-index:1}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
         background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.07)}
  .search{flex:1 1 240px;position:relative}
  .search input{width:100%;font:inherit;padding:10px 14px 10px 40px;border-radius:999px;border:1px solid var(--line);
       background:var(--bg);color:var(--ink)}
  .search input:focus{outline:2px solid var(--accent);border-color:transparent}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{all:unset;cursor:pointer;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
       background:var(--card);color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--accent)}

  .novos{margin:18px 0 0;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft)}
  .novos h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .novos ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px}
  .novos a{color:var(--ink);text-decoration:none;font-size:15px;border-bottom:1px solid currentColor}
  .novos a:hover{color:var(--accent)}

  /* ---------- grelha de temas ---------- */
  .grelha{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
  @media (max-width:760px){ .grelha{grid-template-columns:repeat(2,1fr);gap:12px} }
  .tema-card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;
       min-height:170px;padding:18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);
       transition:transform .15s, box-shadow .15s, border-color .15s;overflow:hidden}
  .tema-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.09);border-color:var(--c)}
  .tema-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .tema-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
  .tema-card .num{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
  .tema-card .simb{position:absolute;right:14px;top:14px;font:italic 600 34px/1 Georgia,serif;color:var(--c);opacity:.9}
  .tema-card h3{margin:auto 0 4px;font:600 21px/1.2 Georgia,"Times New Roman",serif;padding-right:4px}
  .tema-card .cont{font-size:13px;color:var(--muted)}
  .tema-card .vazio-t{font-style:italic}
  .tema-card.sem{opacity:.6}
  .ponto{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.05em;
       padding:1px 7px;border-radius:999px;background:#f2b84b;color:#3a2a00;vertical-align:1px}
  @media (max-width:460px){ .tema-card{min-height:140px;padding:14px} .tema-card h3{font-size:18px} .tema-card .simb{font-size:26px} }

  /* ---------- vista de um tema ---------- */
  .voltar{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin:20px 0 4px;
       font-size:14px;color:var(--accent);font-weight:600}
  .voltar:focus-visible{outline:2px solid var(--accent)}
  .cab-tema{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
  .cab-tema .simb{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;
       background:var(--c);color:#fff;font:italic 600 26px/1 Georgia,serif}
  .cab-tema h2{margin:0;font:600 28px/1.2 Georgia,"Times New Roman",serif}
  .cab-tema p{margin:0;color:var(--muted);font-size:14px}

  .bloco{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 14px;overflow:hidden}
  .bloco h3{margin:0;padding:14px 18px 4px;font:600 18px/1.2 Georgia,serif}
  ul.lista{list-style:none;margin:0;padding:6px 8px 8px}
  .item a{display:flex;align-items:center;gap:14px;padding:10px;border-radius:10px;color:inherit;text-decoration:none}
  .item a:hover{background:var(--accent-soft)}
  .item a:focus-visible{outline:2px solid var(--accent)}
  .ico{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;
       font-size:11px;font-weight:700;letter-spacing:.03em}
  .txt{flex:1;min-width:0}
  .tit{font-weight:600}
  .meta{display:block;font-size:13px;color:var(--muted)}
  .badge{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
       padding:2px 7px;border-radius:999px;background:#f2b84b;color:#3a2a00;vertical-align:2px}
  .go{flex:none;opacity:.35}
  .item a:hover .go{opacity:.8}

  .vazio{text-align:center;color:var(--muted);padding:40px 0}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 40px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
  </div>
</header>

<main class="wrap panel">
  <div class="tools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Procurar materiais…" aria-label="Procurar materiais">
    </label>
    <div class="chips" id="chips"></div>
  </div>
  <div id="conteudo"></div>
</main>

<footer id="rodape"></footer>

<script src="materiais.js"></script>
<script>
// Compatibilidade com a versão anterior do materiais.js (com DISCIPLINAS)
const LISTA_TEMAS = (typeof TEMAS !== "undefined") ? TEMAS
  : ((typeof DISCIPLINAS !== "undefined" ? (DISCIPLINAS.find(d => d.id === "matA") || DISCIPLINAS[0]).temas : [])
      .map(n => ({nome: n})));
const MATS = MATERIAIS.filter(m => !m.disc || m.disc === "matA");

const TIPOS = {
  slides:    {nome:"Slides",    plural:"Slides",     abrev:"SLD", cor:"var(--slides)"},
  ficha:     {nome:"Ficha",     plural:"Fichas",     abrev:"FT",  cor:"var(--ficha)"},
  resolucao: {nome:"Resolução", plural:"Resoluções", abrev:"RES", cor:"var(--resolucao)"},
  resumo:    {nome:"Resumo",    plural:"Resumos",    abrev:"RSM", cor:"var(--resumo)"},
  app:       {nome:"Aplicação", plural:"Aplicações", abrev:"APP", cor:"var(--app)"},
  outro:     {nome:"Outro",     plural:"Outros",     abrev:"•••", cor:"var(--outro)"},
};
const CORES = ["#1f6f64","#2f6fb3","#c7671e","#8a4fb5","#b8424f","#2e8b57","#a07d1c","#3c5a99","#9b4d74"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hoje = new Date(); hoje.setHours(0,0,0,0);
const dataObj = d => { const [a,m,dd] = (d||"").split("-").map(Number); return a ? new Date(a,m-1,dd) : null; };
const ehNovo = m => { const d = dataObj(m.data); return !!d && d <= hoje && (hoje - d)/864e5 <= (CONFIG.diasNovo ?? 7); };
const fmtData = d => { const o = dataObj(d); return o ? o.toLocaleDateString("pt-PT",{day:"numeric",month:"short"}) : ""; };
const ehLink = f => /^https?:\/\//.test(f);

// Temas que aparecem nos materiais mas não estão na lista vão para o fim
const temas = [...LISTA_TEMAS];
MATS.forEach(m => { if (!temas.some(t => t.nome === m.tema)) temas.push({nome: m.tema}); });
temas.forEach((t,i) => { t.cor = t.cor || CORES[i % CORES.length]; t.id = slug(t.nome); t.simbolo = t.simbolo || String(i+1); });

let filtroTipo = null;

$("#titulo").textContent = CONFIG.titulo;
$("#subtitulo").textContent = CONFIG.subtitulo;
document.title = CONFIG.titulo;
$("#rodape").textContent = CONFIG.subtitulo.split("·")[0].trim();

const temaAtual = () => temas.find(t => "#" + t.id === decodeURIComponent(location.hash)) || null;

function itemHTML(m, mostrarTema){
  const t = TIPOS[m.tipo] || TIPOS.outro;
  const meta = [mostrarTema ? m.tema : null, t.nome, fmtData(m.data)].filter(Boolean).join(" · ");
  return `<li class="item"><a href="${esc(m.ficheiro)}" target="_blank" rel="noopener">
      <span class="ico" style="background:${t.cor}">${t.abrev}</span>
      <span class="txt">
        <span class="tit">${esc(m.titulo)}</span>${ehNovo(m) ? '<span class="badge">NOVO</span>' : ""}
        <span class="meta">${esc(m.nota ? m.nota + " · " + meta : meta)}</span>
      </span>
      <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${
        ehLink(m.ficheiro) ? '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'
                           : '<path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>'}</svg>
    </a></li>`;
}

function desenharChips(lista){
  const usados = Object.keys(TIPOS).filter(t => lista.some(m => m.tipo === t));
  if (filtroTipo && !usados.includes(filtroTipo)) filtroTipo = null;
  $("#chips").innerHTML = usados.map(t =>
    `<button class="chip" aria-pressed="${filtroTipo===t}" data-t="${t}">${TIPOS[t].nome}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    filtroTipo = filtroTipo === c.dataset.t ? null : c.dataset.t; desenhar();
  });
}

function filtrar(lista, q){
  return lista.filter(m => (!filtroTipo || m.tipo === filtroTipo) &&
    (!q || norm(m.titulo + " " + m.tema + " " + (m.nota||"") + " " + (TIPOS[m.tipo]?.nome||"")).includes(q)));
}

function desenhar(){
  const q = norm($("#q").value.trim());
  const T = temaAtual();
  const el = $("#conteudo");

  if (T) {                                   // ---- vista de um tema
    const doTema = MATS.filter(m => m.tema === T.nome);
    desenharChips(doTema);
    const itens = filtrar(doTema, q);
    // agrupar por tipo, pela ordem de TIPOS
    const grupos = Object.keys(TIPOS).map(k => [k, itens.filter(m => (TIPOS[m.tipo] ? m.tipo : "outro") === k)])
                                     .filter(([,l]) => l.length);
    el.innerHTML = `
      <button class="voltar" id="voltar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 6-6 6 6 6"/></svg>
        Todos os temas</button>
      <div class="cab-tema" style="--c:${T.cor}">
        <div class="simb">${esc(T.simbolo)}</div>
        <div><h2>${T.codigo ? esc(T.codigo) + " · " : ""}${esc(T.nome)}</h2><p>${doTema.length} ${doTema.length === 1 ? "material" : "materiais"}</p></div>
      </div>
      ${grupos.length ? grupos.map(([k,l]) => `
        <section class="bloco"><h3>${TIPOS[k].plural}</h3>
        <ul class="lista">${l.map(m => itemHTML(m,false)).join("")}</ul></section>`).join("")
      : `<p class="vazio">${doTema.length ? "Não encontrei materiais com esse filtro." : "Ainda não há materiais neste tema."}</p>`}`;
    $("#voltar").onclick = () => { location.hash = ""; };
    return;
  }

  desenharChips(MATS);

  if (q || filtroTipo) {                     // ---- resultados de pesquisa
    const itens = filtrar(MATS, q);
    el.innerHTML = itens.length
      ? `<section class="bloco" style="margin-top:20px"><h3>${itens.length} ${itens.length===1?"resultado":"resultados"}</h3>
         <ul class="lista">${itens.map(m => itemHTML(m,true)).join("")}</ul></section>`
      : `<p class="vazio">Não encontrei materiais${q ? ` para «${esc($("#q").value)}»` : ""}.</p>`;
    return;
  }

  // ---- página inicial: novidades + grelha
  const novos = MATS.filter(ehNovo).sort((a,b) => b.data.localeCompare(a.data));
  el.innerHTML = `
    ${novos.length ? `<section class="novos"><h2>Novo esta semana</h2><ul>${novos.map(m =>
        `<li><a href="${esc(m.ficheiro)}" target="_blank" rel="noopener">${esc(m.titulo)}</a></li>`).join("")}</ul></section>` : ""}
    <div class="grelha">${temas.map((t,i) => {
      const n = MATS.filter(m => m.tema === t.nome).length;
      const temNovo = MATS.some(m => m.tema === t.nome && ehNovo(m));
      return `<button class="tema-card ${n ? "" : "sem"}" style="--c:${t.cor}" data-id="${t.id}">
        <span class="num">${esc(t.codigo || "TEMA " + (i+1))}</span>
        <span class="simb">${esc(t.simbolo)}</span>
        <h3>${esc(t.nome)}</h3>
        <span class="cont">${n ? `${n} ${n===1?"material":"materiais"}` : '<span class="vazio-t">em breve</span>'}${temNovo ? '<span class="ponto">NOVO</span>' : ""}</span>
      </button>`; }).join("")}
    </div>`;
  el.querySelectorAll(".tema-card").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}

$("#q").addEventListener("input", desenhar);
addEventListener("hashchange", () => { filtroTipo = null; $("#q").value = ""; desenhar(); scrollTo(0,0); });
desenhar();
</script>
</body>
</html>
